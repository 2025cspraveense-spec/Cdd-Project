# =============================================================================
# Secret Leak Guard v2.0 - Unified Reverse Proxy Gateway Configuration
# Nginx 1.27.5 Hardened Reverse Proxy on slg-network
# Listens on Ports 80 and 8080 with 1000MB archive support and JSON error pages
# =============================================================================

pid /tmp/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Non-root temp directories
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer & Upload Size Limits (Up to 1000MB archive ingestion)
    client_max_body_size 1000M;
    client_body_buffer_size 16M;
    client_body_timeout 600s;

    # Extended Proxy Timeouts for Large Scans & Analysis
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging format
    log_format main_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    # Upstream service pools on slg-network
    upstream frontend_service {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_service {
        server backend:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vault_service {
        server vault:8200 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # =========================================================================
    # Main Server Configuration (Dual Listening on Ports 80 and 8080)
    # =========================================================================
    server {
        listen 80;
        listen 8080;
        server_name _;

        # ---------------------------------------------------------------------
        # Strict HTTP Security Headers
        # ---------------------------------------------------------------------
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---------------------------------------------------------------------
        # Custom JSON Error Handlers (413 & 502)
        # ---------------------------------------------------------------------
        error_page 413 = @json_413;
        error_page 502 = @json_502;
        error_page 504 = @json_504;

        location @json_413 {
            default_type application/json;
            return 413 '{"status":"error","code":413,"error":"PayloadTooLarge","message":"Uploaded archive exceeds the maximum permitted limit of 1000MB."}\n';
        }

        location @json_502 {
            default_type application/json;
            return 502 '{"status":"error","code":502,"error":"BadGateway","message":"Upstream service temporarily unavailable. Gateway failed to connect to target service."}\n';
        }

        location @json_504 {
            default_type application/json;
            return 504 '{"status":"error","code":504,"error":"GatewayTimeout","message":"Upstream service timed out processing the scan request."}\n';
        }

        # ---------------------------------------------------------------------
        # Gateway Health Status
        # ---------------------------------------------------------------------
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"unified-gateway","version":"1.27.5","ports":[80,8080]}\n';
        }

        # ---------------------------------------------------------------------
        # Scanner Backend REST API Routing (/api/v1/)
        # ---------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend_service/api/v1/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Allow large archives without buffering to disk prematurely
            proxy_request_buffering off;
        }

        # ---------------------------------------------------------------------
        # HashiCorp Vault UI & API Routing (/vault/)
        # ---------------------------------------------------------------------
        location /vault/ {
            rewrite ^/vault/(.*) /$1 break;
            proxy_pass http://vault_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Vault-Token $http_x_vault_token;

            proxy_redirect / /vault/;
        }

        # ---------------------------------------------------------------------
        # Frontend React 18.2 Dashboard Routing (/ and /app/)
        # ---------------------------------------------------------------------
        location /app/ {
            rewrite ^/app/(.*) /$1 break;
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
