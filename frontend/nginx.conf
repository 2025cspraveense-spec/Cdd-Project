# Non-root Nginx server configuration for Secret Leak Guard Frontend (Port 3000)
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths writable by non-root UID 10001
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Single Page Application routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Content-hashed build outputs can be cached immutably.
        location ~* "\.[0-9a-f]{12}\.(?:css|js)$" {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Fixed-name scripts and styles must revalidate after deployments.
        location ~* \.(?:css|js)$ {
            expires off;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Static media and fonts
        location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Health endpoint
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"frontend","port":3000}';
        }
    }
}
