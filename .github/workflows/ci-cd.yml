name: Secret Leak Guard v2.0 - CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ===========================================================================
  # Job 1: Secret Scanning (Gitleaks)
  # ===========================================================================
  secret-scan:
    name: 🛡️ Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ===========================================================================
  # Job 2: Build & Automated Testing (Backend & Frontend)
  # ===========================================================================
  build-and-test:
    name: 🧪 Automated Test Suite & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Pytest Unit and Integration Suite
        run: |
          python -m pytest -v --tb=short

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Compile Assets
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

  # ===========================================================================
  # Job 3: Security & Vulnerability Scanning (Trivy)
  # ===========================================================================
  security-scan:
    name: 🔍 Trivy Vulnerability & SAST Audit
    needs: [secret-scan, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem & Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          skip-dirs: "scan_targets/demo_vulnerable_project"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          exit-code: "1"

      - name: Upload Trivy SARIF Security Report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem"

  # ===========================================================================
  # Job 4: Multi-Stage Docker Build, Tag & Publish
  # ===========================================================================
  docker-build-and-publish:
    name: 🐳 Docker Multi-Stage Build & GHCR Publish
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Normalize container registry image path
        id: image-name
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the images locally; publish only after image scans pass.
      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:latest
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend:latest
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Gateway Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/gateway:latest
            ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image with Trivy
        id: backend-image-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: "image"
          image-ref: "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-backend-results.sarif"
          exit-code: "1"

      - name: Scan Frontend Image with Trivy
        id: frontend-image-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: "image"
          image-ref: "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-frontend-results.sarif"
          exit-code: "1"

      - name: Scan Gateway Image with Trivy
        id: gateway-image-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: "image"
          image-ref: "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/gateway:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-gateway-results.sarif"
          exit-code: "1"

      - name: Upload Trivy Backend Report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: "trivy-backend-results.sarif"
          category: "trivy-backend-image"

      - name: Upload Trivy Frontend Report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: "trivy-frontend-results.sarif"
          category: "trivy-frontend-image"

      - name: Upload Trivy Gateway Report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: "trivy-gateway-results.sarif"
          category: "trivy-gateway-image"

      - name: Enforce image scan policy
        if: always()
        run: |
          test "${{ steps.backend-image-scan.outcome }}" = "success"
          test "${{ steps.frontend-image-scan.outcome }}" = "success"
          test "${{ steps.gateway-image-scan.outcome }}" = "success"

      - name: Publish scanned images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:latest"
          docker push "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/backend:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend:latest"
          docker push "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/frontend:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/gateway:latest"
          docker push "${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}/gateway:${{ github.sha }}"

  # ===========================================================================
  # Job 5: Automated Deployment, Health Verification & Rollback
  # ===========================================================================
  deploy-and-verify:
    name: 🚀 Automated Deployment & Verification
    needs: [docker-build-and-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Prepare Staging Environment Variables
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          for name in SECRET_KEY JWT_SECRET_KEY VAULT_TOKEN; do
            value="${!name}"
            if [[ ! "$value" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
              echo "Required deployment secret $name is missing or does not meet the minimum format."
              exit 1
            fi
          done
          printf "SECRET_KEY='%s'\nJWT_SECRET_KEY='%s'\nVAULT_TOKEN='%s'\nMAX_CONTENT_LENGTH=1048576000\n" \
            "$SECRET_KEY" "$JWT_SECRET_KEY" "$VAULT_TOKEN" > .env

      - name: Deploy 5-Service Stack via Docker Compose
        run: |
          docker compose down --remove-orphans || true
          docker compose build
          docker compose up -d

      - name: Post-Deployment Health Check Verification
        run: |
          echo "Waiting for services to become healthy..."
          MAX_RETRIES=20
          RETRY_COUNT=0
          
          # Health verification loop
          until curl -s -f http://localhost:80/health && \
                curl -s -f http://localhost:80/api/v1/health && \
                curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ | grep -q "200"; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "❌ Health checks timed out after 100 seconds!"
              exit 1
            fi
            echo "Awaiting healthy status... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 5
          done
          
          echo "✅ All 5 services successfully verified healthy via Gateway on port 80!"

      - name: Automated Rollback on Deployment Failure
        if: failure()
        run: |
          echo "Deployment verification failed. Stopping the temporary stack."
          docker compose down
          rm -f .env
          exit 1

      - name: Remove temporary credentials file
        if: always()
        run: rm -f .env
