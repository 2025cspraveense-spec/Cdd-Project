name: Secret Leak Guard v2.0 - CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Job 1: Secret Scanning (Gitleaks)
  # ===========================================================================
  secret-scan:
    name: 🛡️ Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # ===========================================================================
  # Job 2: Build & Automated Testing (Backend & Frontend)
  # ===========================================================================
  build-and-test:
    name: 🧪 Automated Test Suite & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Pytest Comprehensive Test Suite (85 Test Cases)
        run: |
          python -m pytest -v --tb=short

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Compile Assets
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build

  # ===========================================================================
  # Job 3: Security & Vulnerability Scanning (Trivy)
  # ===========================================================================
  security-scan:
    name: 🔍 Trivy Vulnerability & SAST Audit
    needs: [secret-scan, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem & Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          exit-code: "0"

      - name: Upload Trivy SARIF Security Report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem"

  # ===========================================================================
  # Job 4: Multi-Stage Docker Build, Tag & Publish
  # ===========================================================================
  docker-build-and-publish:
    name: 🐳 Docker Multi-Stage Build & GHCR Publish
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Scanner Backend Image
      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Image
      - name: Build and Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Unified Gateway Image
      - name: Build and Push Unified Gateway Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 5: Automated Deployment, Health Verification & Rollback
  # ===========================================================================
  deploy-and-verify:
    name: 🚀 Automated Deployment & Verification
    needs: [docker-build-and-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Prepare Staging Environment Variables
        run: |
          cp .env.example .env
          sed -i 's/change-me-to-a-very-strong-random-key-in-production/${{ secrets.SECRET_KEY || "prod-random-secret-key-32chars" }}/g' .env
          sed -i 's/change-me-to-a-secure-jwt-signing-key-32chars/${{ secrets.JWT_SECRET_KEY || "prod-jwt-secret-key-32chars" }}/g' .env

      - name: Deploy 5-Service Stack via Docker Compose
        run: |
          docker compose down --remove-orphans || true
          docker compose build
          docker compose up -d

      - name: Post-Deployment Health Check Verification
        run: |
          echo "Waiting for services to become healthy..."
          MAX_RETRIES=20
          RETRY_COUNT=0
          
          # Health verification loop
          until curl -s -f http://localhost:80/health && \
                curl -s -f http://localhost:80/api/v1/health && \
                curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ | grep -q "200"; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "❌ Health checks timed out after 100 seconds!"
              exit 1
            fi
            echo "Awaiting healthy status... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 5
          done
          
          echo "✅ All 5 services successfully verified healthy via Gateway on port 80!"

      - name: Automated Rollback on Deployment Failure
        if: failure()
        run: |
          echo "⚠️ Deployment verification failed! Initiating automated rollback..."
          docker compose logs --tail=100
          docker compose down
          echo "Stack safely rolled back."
          exit 1
